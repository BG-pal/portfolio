<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="100%" height="100%" style="background:#170D13; font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
  <defs>
    <linearGradient id="detailBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22131D"/>
      <stop offset="100%" stop-color="#140B10"/>
    </linearGradient>
    <filter id="shadowBox" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <rect width="1100" height="640" fill="url(#detailBg)"/>

  <!-- Header -->
  <g transform="translate(60, 40)">
    <rect width="360" height="30" rx="6" fill="#2A1624" stroke="#59363B" stroke-width="1"/>
    <text x="14" y="19" fill="#D98A7A" font-size="11" font-weight="700" letter-spacing="1.5">UI ANATOMY &amp; COMPONENT TOKENS</text>
    <text x="252" y="19" fill="#F8EAE5" font-size="11" font-weight="500">· SLOT 07</text>
  </g>

  <!-- Left: Annotated Job Card Anatomy -->
  <g transform="translate(60, 95)" filter="url(#shadowBox)">
    <rect width="470" height="495" rx="16" fill="#24151C" stroke="#59363B" stroke-width="1.5"/>
    
    <!-- Card Top Row -->
    <rect x="24" y="24" width="46" height="46" rx="10" fill="#E11D48"/>
    <text x="47" y="53" fill="#FFFFFF" font-size="22" font-weight="800" text-anchor="middle">A</text>
    
    <text x="82" y="42" fill="#F8EAE5" font-size="17" font-weight="700">Senior Product Designer</text>
    <text x="82" y="62" fill="#B39AA2" font-size="12">Airbnb · San Francisco, CA</text>

    <rect x="380" y="26" width="66" height="24" rx="12" fill="#153625" stroke="#22C55E" stroke-width="1"/>
    <text x="413" y="42" fill="#4ADE80" font-size="11" font-weight="700" text-anchor="middle">Active</text>

    <!-- Token Chips Grid -->
    <g transform="translate(24, 90)">
      <rect x="0" y="0" width="75" height="26" rx="6" fill="#1F121B" stroke="#59363B" stroke-width="1"/>
      <text x="37" y="17" fill="#F8EAE5" font-size="11" text-anchor="middle">Full-time</text>

      <rect x="83" y="0" width="70" height="26" rx="6" fill="#1F121B" stroke="#59363B" stroke-width="1"/>
      <text x="118" y="17" fill="#F8EAE5" font-size="11" text-anchor="middle">Remote</text>

      <rect x="161" y="0" width="68" height="26" rx="6" fill="#1F121B" stroke="#59363B" stroke-width="1"/>
      <text x="195" y="17" fill="#F8EAE5" font-size="11" text-anchor="middle">Design</text>

      <rect x="237" y="0" width="60" height="26" rx="6" fill="#1F121B" stroke="#59363B" stroke-width="1"/>
      <text x="267" y="17" fill="#F8EAE5" font-size="11" text-anchor="middle">Tech</text>
    </g>

    <!-- Compensation & Meta -->
    <g transform="translate(24, 136)">
      <circle cx="8" cy="8" r="6" fill="#D98A7A"/>
      <text x="22" y="12" fill="#F8EAE5" font-size="13" font-weight="700">$160k - $210k/yr</text>
      <text x="340" y="12" fill="#B39AA2" font-size="11" text-anchor="end">Apply by: Oct 30</text>
    </g>

    <!-- View Details CTA Button -->
    <rect x="24" y="165" width="422" height="42" rx="8" fill="#873546" stroke="#D98A7A" stroke-width="1"/>
    <text x="235" y="191" fill="#FFFFFF" font-size="13" font-weight="600" text-anchor="middle">View Details</text>

    <!-- Annotation Callouts -->
    <g transform="translate(24, 235)">
      <line x1="0" y1="0" x2="422" y2="0" stroke="#3D2230" stroke-width="1"/>
      <text x="0" y="24" fill="#D98A7A" font-size="12" font-weight="700">DESIGN TOKEN SYSTEM &amp; SCANNABILITY</text>
      
      <circle cx="6" cy="50" r="3" fill="#D98A7A"/>
      <text x="18" y="54" fill="#B39AA2" font-size="11.5"><tspan fill="#F8EAE5" font-weight="600">Color Tokens:</tspan> Deep Aubergine card surface with Rose-tinted contrast borders</text>

      <circle cx="6" cy="82" r="3" fill="#D98A7A"/>
      <text x="18" y="86" fill="#B39AA2" font-size="11.5"><tspan fill="#F8EAE5" font-weight="600">Status Chips:</tspan> High-visibility emerald Active and coral New badges</text>

      <circle cx="6" cy="114" r="3" fill="#D98A7A"/>
      <text x="18" y="118" fill="#B39AA2" font-size="11.5"><tspan fill="#F8EAE5" font-weight="600">Salary Transparency:</tspan> Explicit compensation ranges prevent candidate hesitation</text>

      <circle cx="6" cy="146" r="3" fill="#D98A7A"/>
      <text x="18" y="150" fill="#B39AA2" font-size="11.5"><tspan fill="#F8EAE5" font-weight="600">8pt Spatial System:</tspan> Micro-spacing ensures compact density across mobile cards</text>

      <circle cx="6" cy="178" r="3" fill="#D98A7A"/>
      <text x="18" y="182" fill="#B39AA2" font-size="11.5"><tspan fill="#F8EAE5" font-weight="600">Direct CTAs:</tspan> Prominent single-action primary buttons to trigger slide drawer</text>
    </g>
  </g>

  <!-- Right: Slide-out Application Drawer Detail -->
  <g transform="translate(570, 95)" filter="url(#shadowBox)">
    <rect width="470" height="495" rx="16" fill="#1C1016" stroke="#D98A7A" stroke-width="1.8"/>

    <!-- Drawer Header -->
    <g transform="translate(26, 26)">
      <text x="0" y="20" fill="#F8EAE5" font-size="16" font-weight="700">Active Application Drawer</text>
      <text x="415" y="20" fill="#B39AA2" font-size="16" text-anchor="end">✕</text>
      <line x1="0" y1="34" x2="418" y2="34" stroke="#3D2230" stroke-width="1"/>
    </g>

    <!-- Candidate Profile Capsule -->
    <g transform="translate(26, 76)">
      <circle cx="20" cy="20" r="18" fill="#59363B"/>
      <text x="20" y="25" fill="#F8EAE5" font-size="12" font-weight="700" text-anchor="middle">SC</text>
      <text x="48" y="18" fill="#F8EAE5" font-size="14" font-weight="600">Sarah Chen</text>
      <text x="48" y="32" fill="#D98A7A" font-size="11">Senior Product Designer · Verified Profile</text>
    </g>

    <!-- Target Role Preview -->
    <g transform="translate(26, 130)">
      <rect width="418" height="64" rx="8" fill="#24151C" stroke="#59363B" stroke-width="1"/>
      <rect x="14" y="14" width="36" height="36" rx="8" fill="#6366F1"/>
      <text x="32" y="38" fill="#FFFFFF" font-size="18" font-weight="800" text-anchor="middle">S</text>
      <text x="60" y="28" fill="#F8EAE5" font-size="13" font-weight="700">Senior Product Designer — Stripe</text>
      <text x="60" y="44" fill="#B39AA2" font-size="11">Full-time · San Francisco, CA</text>
    </g>

    <!-- Metrics Row -->
    <g transform="translate(26, 210)">
      <rect x="0" y="0" width="130" height="52" rx="8" fill="#24151C" stroke="#3D2230" stroke-width="1"/>
      <text x="65" y="24" fill="#D98A7A" font-size="16" font-weight="800" text-anchor="middle">34k</text>
      <text x="65" y="40" fill="#B39AA2" font-size="9.5" text-anchor="middle">TOTAL VIEWS</text>

      <rect x="144" y="0" width="130" height="52" rx="8" fill="#24151C" stroke="#3D2230" stroke-width="1"/>
      <text x="209" y="24" fill="#F8EAE5" font-size="16" font-weight="800" text-anchor="middle">224</text>
      <text x="209" y="40" fill="#B39AA2" font-size="9.5" text-anchor="middle">APPLICANTS</text>

      <rect x="288" y="0" width="130" height="52" rx="8" fill="#24151C" stroke="#3D2230" stroke-width="1"/>
      <text x="353" y="24" fill="#4ADE80" font-size="16" font-weight="800" text-anchor="middle">10</text>
      <text x="353" y="40" fill="#B39AA2" font-size="9.5" text-anchor="middle">INTERVIEWING</text>
    </g>

    <!-- Contextual Explanation -->
    <g transform="translate(26, 280)">
      <text x="0" y="16" fill="#D98A7A" font-size="12" font-weight="700">DRAWER BEHAVIOR &amp; CONVERSION ADVANTAGE</text>
      <rect y="28" width="418" height="96" rx="8" fill="#24151C" stroke="#59363B" stroke-width="1"/>
      <text x="14" y="52" fill="#F8EAE5" font-size="11.5" font-weight="600">Preserving Page Context:</text>
      <text x="14" y="70" fill="#B39AA2" font-size="11">Instead of redirecting candidates to a separate application URL,</text>
      <text x="14" y="86" fill="#B39AA2" font-size="11">the drawer overlays the search matrix. Candidates can cross-reference</text>
      <text x="14" y="102" fill="#B39AA2" font-size="11">job requirements against their profile without losing search state.</text>
    </g>

    <!-- Submit CTA -->
    <rect x="26" y="420" width="418" height="46" rx="8" fill="#D98A7A"/>
    <text x="235" y="449" fill="#170D13" font-size="14" font-weight="800" text-anchor="middle">Sign Up &amp; 1-Click Apply →</text>
  </g>
</svg>
